# Issues are DISABLED on this repository and always were, so nothing in this
# directory currently renders. The templates are kept for forks, which get a
# working set of report forms the moment they enable Issues; this config keeps
# blank issues off so every report starts from one of them.
blank_issues_enabled: false
contact_links:
  - name: 💬 Questions, ideas, "is this supposed to work?"
    url: https://github.com/BuddhiLW/ClojureWasm/discussions
    about: >-
      Anything open-ended belongs in Discussions rather than an issue — usage
      questions, design conversations, showing what you built.
  - name: 🔒 Report a security vulnerability (private)
    url: https://github.com/BuddhiLW/ClojureWasm/security/advisories/new
    about: >-
      Do NOT report security problems in public. Use private vulnerability
      reporting — see SECURITY.md for scope and what to include.
