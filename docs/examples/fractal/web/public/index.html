<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>cljw fractal zoom</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --fg: #e6edf3; --dim: #8b949e; --accent: #58a6ff; --hot: #f78166; --ok: #3fb950;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, sans-serif; }
  #app { display: flex; flex-direction: column; min-height: 100vh; }
  header {
    padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 8px 12px;
    align-items: center; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 15px; margin: 0 4px 0 0; font-weight: 600; }
  button, select, input[type=text] {
    background: #21262d; color: var(--fg); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 9px; font-size: 13px;
  }
  button { cursor: pointer; }
  button.active { border-color: var(--accent); color: var(--accent); }
  button:hover { border-color: var(--accent); }
  input[type=text] { width: 13ch; font: 12px ui-monospace, monospace; }
  .ctl { display: flex; align-items: center; gap: 6px; color: var(--dim); flex-wrap: wrap; }
  input[type=range] { accent-color: var(--accent); width: 110px; }
  #wrap { position: relative; flex: 1; min-height: 55vh; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #view:active { cursor: grabbing; }
  .hud {
    position: absolute; top: 8px; padding: 6px 9px; border-radius: 6px;
    background: rgba(13,17,23,.82); border: 1px solid var(--border);
    font: 11px/1.5 ui-monospace, monospace; color: var(--dim); pointer-events: none; white-space: pre;
  }
  .hud:empty { display: none !important; }
  #hudL { left: 8px; } #hudR { right: 8px; }
  #divider { position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: var(--hot); pointer-events: none; }
  #stats {
    padding: 10px 12px; background: var(--panel); border-top: 1px solid var(--border);
    display: grid; gap: 10px; grid-template-columns: 1fr;
  }
  @media (min-width: 900px) { #stats { grid-template-columns: 1fr 1.4fr; } }
  table { border-collapse: collapse; width: 100%; font: 12px/1.5 ui-monospace, monospace; }
  th, td { text-align: right; padding: 3px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--dim); font-weight: 500; }
  .scroll { overflow-x: auto; }
  #chart { display: block; width: 100%; height: 90px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; }
  .ok { color: var(--ok); } .bad { color: var(--hot); }
  .note { color: var(--dim); font-size: 12px; }
  kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="/js/main.js"></script>
</body>
</html>
